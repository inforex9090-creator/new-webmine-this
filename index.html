<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Marketing UI Mockup - Local Host</title>
  <style>
    :root {
      --bg: #02132b;
      --surface: #0f2037;
      --primary: #47f6c6;
      --text: #d5e3ff;
      --text-muted: #84948d;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      width: 90%;
      text-align: center;
      background-color: var(--surface);
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(71, 246, 198, 0.2);
    }

    h1 {
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: block;
      padding: 1rem 2rem;
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }

    .btn:hover {
      background-color: var(--primary);
      color: var(--bg);
      box-shadow: 0 0 15px rgba(71, 246, 198, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Meme Marketing UI Mockup</h1>
    <p>Select which screen to open on localhost:</p>
    <div class="links">
      <a href="/desktop.html" class="btn" target="_blank">💻 View Desktop Screen</a>
      <a href="/mobile.html" class="btn" target="_blank">📱 View Mobile Screen</a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Get Started | Webmine Media Onboarding</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  
  <!-- Tailwind & Custom CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/styles.css">
  
  <script id="tailwind-config">
    try {
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface": "#e3e2e7",
              "surface-container": "#1e1f23",
              "secondary-fixed": "#e4e2e4",
              "tertiary-container": "#919092",
              "secondary": "#c8c6c8",
              "primary-container": "#ff5545",
              "on-primary-container": "#5c0002",
              "on-primary": "#690003",
              "error-container": "#93000a",
              "error": "#ffb4ab",
              "inverse-surface": "#e3e2e7",
              "on-surface-variant": "#e7bdb7",
              "surface": "#121317",
              "outline-variant": "#5d3f3b",
              "surface-bright": "#38393d",
              "surface-container-high": "#292a2e",
              "primary": "#ffb4aa",
              "surface-dim": "#121317",
              "tertiary": "#c8c6c8",
              "surface-tint": "#ffb4aa",
              "background": "#121317",
              "surface-container-low": "#1a1b1f",
              "surface-container-lowest": "#0d0e12",
              "surface-variant": "#343539"
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            spacing: {
              "margin-mobile": "16px",
              "margin-desktop": "64px",
              "base": "8px",
              "gutter": "24px",
              "container-max": "1280px",
              "stack-lg": "64px",
              "stack-md": "32px",
              "stack-sm": "12px"
            },
            fontFamily: {
              "display-hero": ["Anybody"],
              "body-lg": ["Hanken Grotesk"],
              "label-caps": ["Space Mono"],
              "headline-md": ["Anybody"],
              "headline-lg": ["Anybody"],
              "body-md": ["Hanken Grotesk"],
              "button-text": ["Anybody"]
            }
          }
        }
      }
    } catch (_e) {}
  </script>
</head>
<body class="bg-surface text-on-surface font-body-md overflow-x-hidden selection:bg-primary selection:text-on-primary">

  <!-- Header Component -->
  <header class="bg-surface/80 backdrop-blur-md border-b border-outline-variant fixed top-0 w-full z-50 h-20">
    <nav class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto h-full w-full">
      <a href="/" class="flex items-center gap-2 text-[20px] md:text-headline-md font-display-hero tracking-tighter text-primary uppercase">
        WEB<span class="text-on-surface">MINE</span> MEDIA
      </a>
      <a href="/" class="text-secondary hover:text-primary transition-colors font-body-md text-body-md flex items-center gap-1">
        <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Home
      </a>
    </nav>
  </header>

  <main class="pixel-grid pt-28 pb-20 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-margin-mobile md:px-gutter max-w-2xl relative z-10">
      
      <!-- Card Container -->
      <div id="form-container" class="border-2 border-primary-container overflow-hidden rounded-xl bg-surface-container-high hard-shadow">
        <!-- Retro Header -->
        <div class="window-header-red flex justify-between items-center px-4">
          <div class="flex items-center gap-1.5">
            <div class="window-dot"></div><div class="window-dot"></div><div class="window-dot"></div>
          </div>
          <span class="text-xs font-label-caps text-on-surface-variant uppercase">WEBMINE MEDIA</span>
        </div>
        
        <!-- Form Content -->
        <div class="p-8 md:p-12">
          <div id="form-header">
            <h1 class="font-display-hero text-[32px] md:text-headline-lg text-primary uppercase leading-tight mb-2">Start Your Project</h1>
            <p class="text-on-surface-variant text-base mb-8">Tell us about your objectives. Our engineering team will review and provide a structured proposal within 24 hours.</p>
          </div>

          <!-- Alert banner for errors -->
          <div id="error-banner" class="hidden mb-6 p-4 bg-error-container text-on-error-container border-l-4 border-error rounded flex items-center gap-3">
            <span class="material-symbols-outlined shrink-0">error</span>
            <span id="error-message" class="text-sm font-semibold"></span>
          </div>

          <form id="onboarding-form" class="space-y-6">
            <!-- Name Input -->
            <div class="flex flex-col gap-2">
              <label for="name" class="font-label-caps text-xs text-primary uppercase tracking-wider">Full Name *</label>
              <input type="text" id="name" name="name" required
                class="bg-surface border border-outline-variant rounded p-3 text-on-surface placeholder:text-tertiary/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"
                placeholder="John Doe">
            </div>

            <!-- Email Input -->
            <div class="flex flex-col gap-2">
              <label for="email" class="font-label-caps text-xs text-primary uppercase tracking-wider">Business Email *</label>
              <input type="email" id="email" name="email" required
                class="bg-surface border border-outline-variant rounded p-3 text-on-surface placeholder:text-tertiary/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"
                placeholder="johndoe@company.com">
            </div>

            <!-- Services Checkboxes -->
            <div class="flex flex-col gap-3">
              <label class="font-label-caps text-xs text-primary uppercase tracking-wider block">Services Needed *</label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <label class="flex items-center gap-3 bg-surface p-3 border border-outline-variant rounded cursor-pointer hover:border-primary/50 transition-colors">
                  <input type="checkbox" name="services" value="Web Design" class="rounded text-primary-container focus:ring-primary bg-surface border-outline-variant">
                  <span class="text-sm text-on-surface font-semibold">Custom Web Design</span>
                </label>
                <label class="flex items-center gap-3 bg-surface p-3 border border-outline-variant rounded cursor-pointer hover:border-primary/50 transition-colors">
                  <input type="checkbox" name="services" value="Managed Security" class="rounded text-primary-container focus:ring-primary bg-surface border-outline-variant">
                  <span class="text-sm text-on-surface font-semibold">Managed Security</span>
                </label>
              </div>
            </div>

            <!-- Description Textarea -->
            <div class="flex flex-col gap-2">
              <label for="description" class="font-label-caps text-xs text-primary uppercase tracking-wider">Project Requirements *</label>
              <textarea id="description" name="description" required rows="4"
                class="bg-surface border border-outline-variant rounded p-3 text-on-surface placeholder:text-tertiary/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"
                placeholder="Please describe the features, design preferences, and timeline of your project..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" class="w-full bg-primary text-on-primary font-bold py-4 rounded-lg flex justify-center items-center gap-2 mt-4 active:scale-95 transition-transform hard-shadow">
              <span class="material-symbols-outlined" id="btn-icon">send</span>
              <span id="btn-text">Submit Inquiry</span>
            </button>
          </form>

          <!-- Success State (Hidden by default) -->
          <div id="success-state" class="hidden text-center py-8">
            <span class="material-symbols-outlined text-[64px] text-primary mb-4 animate-bounce">check_circle</span>
            <h2 class="font-display-hero text-[28px] text-primary uppercase mb-4">Request Transmitted</h2>
            <p id="success-message" class="text-on-surface-variant text-lg mb-8 max-w-md mx-auto"></p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
              <a href="/" class="bg-primary text-on-primary px-8 py-3 rounded font-bold hard-shadow text-center">
                Return Home
              </a>
              <button onclick="resetForm()" class="bg-surface border border-outline-variant px-8 py-3 rounded font-bold hover:bg-surface-container-high text-center">
                Submit Another Request
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script>
    const onboardingForm = document.getElementById('onboarding-form');
    const formHeader = document.getElementById('form-header');
    const successState = document.getElementById('success-state');
    const successMessage = document.getElementById('success-message');
    const errorBanner = document.getElementById('error-banner');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');

    // Form Submission Logic
    onboardingForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset states
      errorBanner.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.innerText = 'Transmitting...';
      btnIcon.innerText = 'sync';
      btnIcon.classList.add('animate-spin');

      // Get values
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const description = document.getElementById('description').value;
      
      const services = [];
      document.querySelectorAll('input[name="services"]:checked').forEach(checkbox => {
        services.push(checkbox.value);
      });

      try {
        const response = await fetch('/api/get-started', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name,
            email,
            services,
            description
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          // Show success state
          onboardingForm.classList.add('hidden');
          formHeader.classList.add('hidden');
          successMessage.innerText = result.message;
          successState.classList.remove('hidden');
        } else {
          // Show error banner
          errorMessage.innerText = result.message || 'An unexpected error occurred.';
          errorBanner.classList.remove('hidden');
          resetBtnState();
        }
      } catch (err) {
        console.error("Submission error:", err);
        errorMessage.innerText = 'Network error: Failed to connect to server.';
        errorBanner.classList.remove('hidden');
        resetBtnState();
      }
    });

    function resetBtnState() {
      submitBtn.disabled = false;
      btnText.innerText = 'Submit Inquiry';
      btnIcon.innerText = 'send';
      btnIcon.classList.remove('animate-spin');
    }

    function resetForm() {
      onboardingForm.reset();
      successState.classList.add('hidden');
      onboardingForm.classList.remove('hidden');
      formHeader.classList.remove('hidden');
      resetBtnState();
    }

    // Micro-interactions for buttons
    document.querySelectorAll('.hard-shadow').forEach(button => {
      button.addEventListener('mousedown', () => {
        button.style.transform = 'translate(2px, 2px)';
      });
      button.addEventListener('mouseup', () => {
        button.style.transform = 'translate(0px, 0px)';
      });
      button.addEventListener('mouseleave', () => {
        button.style.transform = 'translate(0px, 0px)';
      });
    });
  </script>
</body>
</html>
